services:
  - type: web
    name: adullum
    runtime: python
    plan: free
    buildCommand: pip install -e .
    # Trust Render's proxy headers, so request.base_url is https:// and magic
    # links ask Supabase to return to the https address (app/cave.py::_redirect_to).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIM
        value: "512"
      - key: CHAT_MODEL
        value: gpt-4o-mini
      - key: ADMIN_EMAILS
        value: odicheobiakarije@gmail.com
      # Amens posts the automatic check is clear about go up straight away;
      # "false" sends every post to the admin desk first.
      - key: AMENS_AUTO_APPROVE
        value: "true"
      - key: SUPPORT_ONCE_URL
        sync: false
      - key: SUPPORT_MONTHLY_URL
        sync: false
      - key: SUPPORT_MONTHLY_AMOUNT
        value: $3
      # Push notifications (scripts/make_vapid_keys.py makes the pair) and the
      # secret the reminders workflow sends. See app/reminders.py.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
      - key: MCP_ALLOWED_HOSTS
        value: 127.0.0.1:8000,localhost:8000,adullum.onrender.com
